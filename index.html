<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Ridge OpenLitterMap Dashboard</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .map-overlay {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(255, 255, 255, 0.95); padding: 12px 16px;
      border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .map-overlay h2 { margin: 0 0 4px 0; font-size: 16px; color: #111827; }
    .map-overlay p { margin: 0; font-size: 12px; color: #6B7280; }
  </style>
</head>
<body>

<div class="map-overlay">
  <h2>Maple Ridge Litter Tracker</h2>
  <p>Live Sync: OpenLitterMap API</p>
</div>
<div id="map"></div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [-122.6010, 49.2193], // Maple Ridge, BC
    zoom: 12
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on('load', () => {
    // Fetch the generated GeoJSON payload committed by the GitHub Action
    map.addSource('litter-data', {
      type: 'geojson',
      data: './public/data/litter.geojson'
    });

    map.addLayer({
      id: 'litter-points',
      type: 'circle',
      source: 'litter-data',
      paint: {
        'circle-radius': 8,
        'circle-color': '#EF4444',
        'circle-stroke-width': 2,
        'circle-stroke-color': '#FFFFFF'
      }
    });

    // Interactive Popup on Click
    map.on('click', 'litter-points', (e) => {
      const coords = e.features[0].geometry.coordinates.slice();
      const props = e.features[0].properties;

      let popupHtml = `<strong>ID:</strong> ${props.id}<br>
                       <strong>Timestamp:</strong> ${props.created_at || 'N/A'}`;

      if (props.photo_url) {
        popupHtml += `<br><img src="${props.photo_url}" width="160" style="margin-top:6px; border-radius:4px;" />`;
      }

      new maplibregl.Popup()
        .setLngLat(coords)
        .setHTML(popupHtml)
        .addTo(map);
    });

    map.on('mouseenter', 'litter-points', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'litter-points', () => map.getCanvas().style.cursor = '');
  });
</script>

</body>
</html>
