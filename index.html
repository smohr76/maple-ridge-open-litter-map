<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Ridge OpenLitterMap GIS</title>

  <!-- 1. MapLibre GL JS Stylesheet -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    /* Category Filter Overlay Styling */
    .filter-ctrl {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Filter Controls -->
  <div class="filter-ctrl">
    <strong>Categories</strong><br>
    <label><input type="checkbox" class="category-filter" value="litter" checked> Litter</label><br>
    <label><input type="checkbox" class="category-filter" value="pet_waste" checked> Pet Waste</label><br>
    <label><input type="checkbox" class="category-filter" value="substances" checked> Nicotine, THC & Alcohol</label>
  </div>

  <!-- 2. MapLibre GL JS Core Engine Script -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- 3. Client GIS Application Script -->
  <script>
    // Instantiate Map Engine using Carto Free Basemap Vector Tiles
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', // $0 Open Basemap
      center: [-122.601, 49.2193], // Maple Ridge Centroid
      zoom: 12
    });

    map.on('load', () => {
      // Ingest the GeoJSON auto-generated by your GitHub Action Pipeline
      map.addSource('litter-data', {
        type: 'geojson',
        data: './data/litter.geojson'
      });

      // Render GIS Layer: Clustered or Categorical Circle Markers
      map.addLayer({
        id: 'litter-points',
        type: 'circle',
        source: 'litter-data',
        paint: {
          'circle-radius': 6,
          'circle-color': '#2e7d32',
          'circle-stroke-width': 1,
          'circle-stroke-color': '#ffffff'
        }
      });
    });
  </script>
</body>
</html>
