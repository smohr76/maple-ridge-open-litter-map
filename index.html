<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litter Map - Stage 2</title>
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    .legend-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.6;
    }
    .legend-box h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    .legend-box label {
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="legend-box" class="legend-box">
  <h4>Categories</h4>
  <label>
    <input type="checkbox" class="group-filter" value="litter" checked> Litter
  </label><br>
  <label>
    <input type="checkbox" class="group-filter" value="pet_waste" checked> Pet Waste
  </label><br>
  <label>
    <input type="checkbox" class="group-filter" value="substances" checked> Nicotine, THC & Alcohol
  </label>
</div>

<div id="map"></div>

<script>
  const map = new maplibre-gl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [-122.5615, 49.2095],
    zoom: 12
  });

  const activeGroups = new Set(["litter", "pet_waste", "substances"]);

  function updateMapFilter() {
    const selected = Array.from(activeGroups);

    if (!map.getLayer("unclustered-point")) return;

    if (selected.length === 0) {
      map.setFilter("unclustered-point", ["literal", false]);
      return;
    }

    const filterExpression = [
      "any",
      ...selected.map(group => ["in", group, ["get", "groups"]])
    ];

    map.setFilter("unclustered-point", filterExpression);
  }

  map.on('load', () => {
    map.addSource('litter-data', {
      type: 'geojson',
      data: './data/litter.geojson'
    });

    map.addLayer({
      id: 'unclustered-point',
      type: 'circle',
      source: 'litter-data',
      paint: {
        'circle-color': '#e63946',
        'circle-radius': 6,
        'circle-stroke-width': 1,
        'circle-stroke-color': '#fff'
      }
    });

    updateMapFilter();
  });

  document.querySelectorAll(".group-filter").forEach(checkbox => {
    checkbox.addEventListener("change", (e) => {
      const val = e.target.value;
      if (e.target.checked) {
        activeGroups.add(val);
      } else {
        activeGroups.delete(val);
      }
      updateMapFilter();
    });
  });
</script>
</body>
</html>
