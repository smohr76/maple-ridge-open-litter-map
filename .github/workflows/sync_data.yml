name: Sync OpenLitterMap GeoJSON Data

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual pipeline execution from GitHub UI

jobs:
  sync-geojson:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants write access to push updated litter.geojson

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Authentication Secrets
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: |
          python - <<'PY'
          import os

          email = os.getenv("OLM_EMAIL", "").strip()
          password = os.getenv("OLM_PASSWORD", "").strip()

          if not email:
              raise SystemExit("[CRITICAL ERROR] OLM_EMAIL secret is unpopulated or missing.")
          if not password:
              raise SystemExit("[CRITICAL ERROR] OLM_PASSWORD secret is unpopulated or missing.")

          print("[SUCCESS] Credentials present. Proceeding with authentication.")
          PY

      - name: Execute OLM Pipeline
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: python scripts/fetch_olm.py

      - name: Commit and Push Updated GeoJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/litter.geojson
          
          # Skip commit if GeoJSON payload is unchanged
          if git diff --staged --quiet; then
            echo "[INFO] No changes detected in data/litter.geojson. Skipping commit."
          else
            git commit -m "chore(data): auto-update litter.geojson via sync job [skip ci]"
            git push
          fi
