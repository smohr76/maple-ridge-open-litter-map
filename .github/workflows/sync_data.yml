name: Sync OpenLitterMap Data

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allows manual triggers from GitHub Actions UI

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # --- DIAGNOSTIC TEST STEP ---
      - name: Run Authentication Diagnostic Test
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: python tests/test_auth.py

      # TEMPORARY DIAGNOSTIC STEP
      - name: Run API Endpoint Diagnostics
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: python scripts/debug_api.py

      # --- MAIN PIPELINE STEP ---
      - name: Execute ETL Extraction Script
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: python scripts/fetch_olm.py

      - name: Commit Updated GeoJSON Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/litter.geojson
          git diff-index --quiet HEAD || git commit -m "chore: automated OpenLitterMap data sync"
          git push
