name: Sync OpenLitterMap GeoJSON Data

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual pipeline execution from GitHub UI

jobs:
  sync-geojson:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants write access to push updated litter.geojson files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute OLM Data Sync Pipeline
        env:
          OLM_EMAIL: ${{ secrets.OLM_EMAIL }}
          OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
        run: python scripts/sync_data.py

      - name: Commit and Push Canonical GeoJSON Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage both canonical GeoJSON paths
          git add data/litter.geojson public/data/litter.geojson 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "[INFO] No changes detected in GeoJSON datasets. Skipping commit."
          else
            git commit -m "chore(data): auto-update canonical litter.geojson datasets [skip ci]"
            git push
          fi
