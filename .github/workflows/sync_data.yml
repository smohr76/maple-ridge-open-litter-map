name: Sync OpenLitterMap GeoJSON Data

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual pipeline execution from GitHub UI

jobs:
  sync-geojson:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to commit and push updated data back to repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute OLM Data Pipeline
        env:
          OLM_API_URL: ${{ secrets.OLM_API_URL }}
          OLM_API_TOKEN: ${{ secrets.OLM_API_TOKEN }}
        run: python scripts/fetch_olm.py

      - name: Commit and Push Updated GeoJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/litter.geojson
          
          # Only create a commit if data/litter.geojson has actually changed
          if git diff --staged --quiet; then
            echo "[INFO] No changes detected in data/litter.geojson. Skipping commit."
          else
            git commit -m "chore(data): auto-update litter.geojson via sync job [skip ci]"
            git push
          fi
